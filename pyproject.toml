[build-system]
# 1.27: PEP 639 license metadata
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ruleforge"
version = "1.0.0"
description = "Measure and improve how consistently judge models interpret multi-rule rulesets: the code of 'Aligning Judge Models to Be Logically Consistent Multi-Rule Interpreters'"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "data/README.md"]
authors = [
    { name = "Michel Liao", email = "michel.liao22@gmail.com" },
    { name = "Nimra Nadeem" },
    { name = "Luxi He" },
    { name = "Peter Henderson" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fuzzysearch>=0.8.0",
    "hydra-core>=1.3.2",
    "numpy>=2.0",
    "omegaconf>=2.3.0",
    "packaging>=21.3",
    "pyyaml>=5.1",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
# openai>=2.25.0: vLLM 0.28 imports NamespaceTool, first shipped there; each provider SDK is bounded below its next major
openai = ["openai>=2.25.0,<3", "tiktoken>=0.12.0"]
anthropic = ["anthropic>=0.80.0,<1"]
providers = ["ruleforge[openai,anthropic]"]
# Install torch and vLLM built for your CUDA before this extra
vllm = ["vllm==0.28.0", "torch==2.13.0", "transformers>=5.17.0", "tokenizers>=0.21.1"]
grpo = [
    "accelerate>=1.11.0",
    "deepspeed>=0.18.6",
    "kernels>=0.12.3",
    "peft>=0.21.0",
    "pyarrow>=21.0.0",
    "safetensors>=0.6.2",
    "tokenizers>=0.21.1",
    "torch==2.13.0",
    "transformers>=5.17.0",
    "trl>=1.13.0",
]
viz = ["matplotlib>=3.10.7"]
slurm = ["submitit>=1.5.3", "hydra-submitit-launcher>=1.2.0"]
hub = ["huggingface-hub>=0.35.3", "datasets>=3.2.0", "zstandard>=0.23.0", "pyarrow>=21.0.0"]
wandb = ["wandb>=0.22.3"]

[project.scripts]
ruleforge = "ruleforge.cli:main"

[project.entry-points."ruleforge.tasks"]
modelspec = "ruleforge.tasks.modelspec:ModelSpecTask"
legal = "ruleforge.tasks.legal:LegalTask"

[project.urls]
Repository = "https://github.com/princeton-polaris-lab/inconsistent-judges"
Dataset = "https://huggingface.co/datasets/ai-law-society-lab/inconsistent-judges"
Model = "https://huggingface.co/ai-law-society-lab/inconsistent-judges"

[tool.hatch.build.targets.wheel]
packages = ["src/ruleforge"]

[tool.hatch.build.targets.wheel.force-include]
# Named file by file, so the wheel built from the sdist matches the checkout's
"data/rules/modelspec/openai_rules_all.jsonl" = "ruleforge/data/rules/modelspec/openai_rules_all.jsonl"
"data/rules/modelspec/openai_rules_all_full.jsonl" = "ruleforge/data/rules/modelspec/openai_rules_all_full.jsonl"
"data/rules/modelspec/ruleforge/README.md" = "ruleforge/data/rules/modelspec/ruleforge/README.md"
"data/rules/modelspec/ruleforge/seed5_winner.jsonl" = "ruleforge/data/rules/modelspec/ruleforge/seed5_winner.jsonl"
"data/rules/modelspec/ruleforge/seed9_runner_up.jsonl" = "ruleforge/data/rules/modelspec/ruleforge/seed9_runner_up.jsonl"
"data/populations/frozen_500_r3.jsonl" = "ruleforge/data/populations/frozen_500_r3.jsonl"
"data/populations/frozen_500_r3.jsonl.manifest.json" = "ruleforge/data/populations/frozen_500_r3.jsonl.manifest.json"
"configs/pricing/batch_rates.yaml" = "ruleforge/configs/pricing/batch_rates.yaml"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/ruleforge",
    "data/rules/modelspec/openai_rules_all.jsonl",
    "data/rules/modelspec/openai_rules_all_full.jsonl",
    "data/rules/modelspec/ruleforge/README.md",
    "data/rules/modelspec/ruleforge/seed5_winner.jsonl",
    "data/rules/modelspec/ruleforge/seed9_runner_up.jsonl",
    "data/populations/frozen_500_r3.jsonl",
    "data/populations/frozen_500_r3.jsonl.manifest.json",
    "configs/pricing/batch_rates.yaml",
    "README.md",
    "LICENSE",
    "data/README.md",
]

[tool.uv]
default-groups = ["dev", "viz"]
# nvidia-cudnn-frontend 1.29 requires CUDA 13 libraries; this environment is CUDA 12.9
constraint-dependencies = ["nvidia-cudnn-frontend<1.29"]

# CUDA 12.9 builds: the PyPI builds of torch 2.13 and vLLM 0.28 are CUDA 13.0, which a CUDA 12.8 driver cannot run
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# Bump this URL together with the `vllm==` pin in the `vllm` group
[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.28.0/cu129"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/cu129"
explicit = true

[tool.uv.sources]
flashinfer-jit-cache = { index = "flashinfer" }
torch = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
torchcodec = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
vllm = { index = "vllm-cu129", marker = "sys_platform == 'linux'" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "experiments"]
addopts = "--strict-markers --strict-config -m 'not gpu and not cluster and not slow'"
markers = [
    "gpu: needs a CUDA device",
    "cluster: needs RULEFORGE_ARTIFACT_ROOT and the raw artifact trees",
    "slow: takes more than a few seconds",
    "torch: needs the grpo group (CPU torch is enough)",
    "frozen: pins a published scientific number",
    "allow_network: may make outbound network calls",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruleforge[providers,hub,wandb,slurm]",
    "transformers>=5.17.0",
]
vllm = [
    "flashinfer-jit-cache==0.6.16.post3+cu129",
    # vLLM pins torch/torchaudio/torchvision itself; named here so the cu129 sources apply
    "torch==2.13.0",
    "torchaudio==2.11.0",
    # PyPI's torchcodec links the CUDA 13 runtime and fails to load beside cu129 torch
    "torchcodec==0.16.0",
    "torchvision==0.28.0",
    "vllm==0.28.0",
]
grpo = [
    "accelerate>=1.11.0",
    "deepspeed>=0.18.6",
    "kernels>=0.12.3",
    "peft>=0.21.0",
    "safetensors>=0.6.2",
    "torch==2.13.0",
    "trl>=1.13.0",
]
viz = [
    "matplotlib>=3.10.7",
    "statsmodels>=0.14.6",
]
population = [
    "lingua-language-detector>=2.0",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/ruleforge"]

[tool.coverage.report]
show_missing = true
precision = 2
include_namespace_packages = true
fail_under = 100
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# flag unused `# noqa` comments
extend-select = ["RUF100"]

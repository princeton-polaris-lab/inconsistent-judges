# The prompt ablation's open judges' naive arms: five temperature-1 draws each over the paper's population.
backend: slurm
gpu-count: 1
cpus: 4
timeout-min: 8640
qos: normal
resumable: true
campaign-id: "{campaign_id}"
population: populations/frozen_500_r3.jsonl
expect-population-sha256: c16f66f4ad3fc93fad46bf31efaa8325f30fb750104d1e13a9326b7cd46b10d4
axis:
  - "model@judge_model+model@agent_model={models}"
  - "eval_cfg.reasoning_prompt_style={styles}"
vars:
  campaign_id: null
  models: gemma4-31b-tp-2,gpt-oss-tp-2,olmo3-32b-tp-2
  styles: naive-rules-above
  attempts: 20
args:
  - sampling.campaign_mode=final
  - sampling.num_decoder_draws=5
  - sampling.max_semantic_attempts={attempts}
  - judge_model.tp_size=1

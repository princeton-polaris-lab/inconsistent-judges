# The Hub repositories: each experiment's campaign roots, each with its compact archive's members digest, and the other
# files it reads, each with where it lands under an artifact root (dest). `python -m ruleforge.hub pack` reads this file;
# data/README.md describes the compact tier.
format: 1
dataset: ai-law-society-lab/inconsistent-judges
model: ai-law-society-lab/inconsistent-judges
compact:
  attempts_conditions: ["forced*"]
  # Files of every campaign root that no rebuild reads: the draws' summaries and implicated-rule lists, the root's own
  # completion gate, each condition's stack record and the root's campaign markers.
  omit: ["**/smrc_summary.json", "**/implicated_rules.json", "completion.json", "**/condition_stack.json", ".ruleforge-*"]
experiments:
  populations:
    files:
      # The paper's 500 evaluation scenarios, as data/populations/ in the code repository holds them.

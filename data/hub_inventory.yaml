      k57-shuffled-2026-11: a30125eec126975f6240290cb008a9f7e70307fd28ad911dd25759ba8e3b1fdf
      k57-shuffled-2026-11-luna: 74e132104046fa8fcf559e26da4870f9c87503d075cbf90f45a655c018aaea71
      k57-shuffled-2026-11-haiku: c145f5762ea0cea86dddc368a56a890c9ef11f84f582255371d699bf08671125

    # rebase record; of a k57 root, its sampling manifest.
    omit:
      fig2-2026-09-pop-a22af097-rescored-lenient_last_line: &bank_rescored ["**/runs.jsonl", "**/draw_provenance.json", "**/request_blocks.jsonl", "*/subsets/*/k57/draw-*/*", "sampling_manifest.json", "scenario_manifest.json", "aggregate/figure2_estimates.json", "label_replay.json"]

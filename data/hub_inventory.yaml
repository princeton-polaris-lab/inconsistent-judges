  ruleset-size:
    # Each judge's bank and sizes 2 to 56, then each judge's size 57, whose analysis joins them. Each root's profile
    # (ruleforge.hub.PROFILES) names what its readers read of its files.
    profile: ruleset-size
    roots:
      fig2-2026-09-pop-a22af097-rescored-lenient_last_line: c8de445475b44aff6eb48e192c6502c86fc6eed6c56474e08e98a1b7014b513f

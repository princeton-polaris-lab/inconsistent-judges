name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Lint with ruff
        run: uvx ruff@0.14.5 check src tests

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install test environment (no vllm group)
        run: >
          uv sync --frozen --no-default-groups
          --group dev --group viz --group grpo

      - name: Run tests with coverage
        run: >
          uv run --no-sync pytest -n auto
          --cov --cov-report=json:coverage.json --cov-report=term-missing

  minimal-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the core dependencies alone
        run: uv sync --frozen --no-default-groups

      - name: Import the package and its toolkit with the core dependencies alone
        run: >
          uv run --no-sync python -c
          "import ruleforge.evaluate.scoring, ruleforge.prompts.context, ruleforge.rulesets.rules,
          ruleforge.rulesets.variants, ruleforge.judges.backend, ruleforge.cli;
          from ruleforge import Ruleset, ScenarioSet, JudgeSpec, Campaign, evaluate, optimize, grpo"

      - name: Install the test tools
        run: uv sync --frozen --no-default-groups --group dev

      - name: Check import hygiene
        run: uv run --no-sync pytest tests/test_import_hygiene.py -m "not torch"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the test environment (no vllm group)
        run: uv sync --frozen --no-default-groups --group dev

      - name: Build, install and run the wheel
        run: uv run --no-sync pytest -m slow tests/test_wheel.py
